# ==============================================================================
# Gradle Build Performance & JVM Tuning
# ==============================================================================
# Cấp phát 4GB RAM + Bộ dọn rác ParallelGC giúp build siêu nhanh
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Bật tiến trình nền Gradle Daemon chạy thường trực
org.gradle.daemon=true

# Thực thi các task độc lập song song (tận dụng tối đa đa nhân CPU)
org.gradle.parallel=true

# Bật lưu bộ nhớ đệm kết quả build (Build Cache)
org.gradle.caching=true

# Theo dõi thay đổi file hệ thống không cần quét lại toàn bộ ổ đĩa
org.gradle.vfs.watch=true

# Bật chế độ sync song song trong Android Studio
org.gradle.tooling.parallel=true

# ==============================================================================
# Android Build & Resource Optimizations
# ==============================================================================
android.useAndroidX=true
android.nonTransitiveRClass=true

# Tắt các tính năng build thừa không dùng để tăng tốc compile
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# ==============================================================================
# Kotlin & KAPT Compilation Speedup
# ==============================================================================
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Tối ưu hóa bộ xử lý KAPT đa luồng
kapt.incremental.apt=true
kapt.use.worker.api=true
kapt.include.compile.classpath=false
